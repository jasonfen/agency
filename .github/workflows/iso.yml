name: Build installer ISO

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # The hosted runner is short on disk; the ISO holds a whole system.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # flake.lock pins the exact versions of everything. It is created here
      # the first time and committed, so every later build is reproducible.
      - name: Create flake.lock on first run
        run: |
          if [ ! -f flake.lock ]; then
            nix flake lock
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add flake.lock
            git commit -m "Add flake.lock"
            git push
          fi

      - name: Build ISO
        run: nix build .#iso --print-build-logs

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: agency-installer
          path: result/iso/*.iso
          compression-level: 0
          retention-days: 3
