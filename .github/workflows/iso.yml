name: Build installer ISO

# Builds the USB installer. It takes several minutes, so it does not run on
# every push: start it from the Actions tab ("Run workflow"), or push a
# version tag such as v0.1.0.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The hosted runner is short on disk and the ISO holds a whole system.
      # Clearing space takes over a minute, so it runs alongside the build.
      - name: Free disk space (in the background)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL &

      - uses: cachix/install-nix-action@v31

      # flake.lock pins the exact versions of everything. It is created here
      # if missing and committed, so every later build is reproducible.
      - name: Create flake.lock if missing
        run: |
          if [ ! -f flake.lock ]; then
            nix flake lock
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add flake.lock
            git commit -m "Add flake.lock"
            git push
          fi

      - name: Build ISO
        run: nix build .#iso --print-build-logs

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: agency-installer
          path: result/iso/*.iso
          compression-level: 0
          retention-days: 3
