name: Build installer ISO

# Builds the USB installer. It takes several minutes, so it does not run on
# every push: start it from the Actions tab ("Run workflow"), or push a
# version tag such as v0.1.0.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The hosted runner is short on disk and the ISO holds a whole system.
      # Clearing space takes over a minute, so it runs alongside the build.
      - name: Free disk space (in the background)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL &

      - uses: cachix/install-nix-action@v31

      # flake.lock pins the exact versions of everything. It is created here
      # if missing and committed, so every later build is reproducible.
      - name: Create flake.lock if missing
        run: |
          if [ ! -f flake.lock ]; then
            nix flake lock
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add flake.lock
            git commit -m "Add flake.lock"
            git push
          fi

      # Builds from main and version tags go to Cloudflare R2, so the download
      # page always offers the newest build. Other builds, and forks without
      # the R2 secrets, keep the ISO as a workflow artifact instead.
      - name: Decide where the ISO goes
        id: r2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -n "$KEY" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "R2 secrets not set, keeping the ISO as an artifact"
          fi

      - name: Build ISO
        run: nix build .#iso --print-build-logs

      - name: Upload ISO
        if: steps.r2.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agency-installer
          path: result/iso/*.iso
          compression-level: 0
          retention-days: 3

      # Uploads the ISO once, then copies it to latest/ inside R2. (Uploading
      # it twice at once is slower: both share the runner's bandwidth.)
      - name: Publish ISO to R2
        if: steps.r2.outputs.publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Newer aws CLI versions send checksums R2 does not accept.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          BUCKET: agency-iso
        run: |
          iso=$(ls result/iso/*.iso)
          date=$(date -u +%Y-%m-%d)
          short=${GITHUB_SHA::7}
          build="builds/$date-$short/agency-installer.iso"
          s3="aws s3 --endpoint-url $R2_ENDPOINT"
          disp='attachment; filename="agency-installer.iso"'

          SECONDS=0
          $s3 cp "$iso" "s3://$BUCKET/$build" --only-show-errors \
            --content-type application/x-iso9660-image --content-disposition "$disp"
          echo "Uploaded in ${SECONDS}s"

          # Larger parts, more at a time: the upload is slower this way, the
          # copy twice as fast.
          aws configure set default.s3.max_concurrent_requests 32
          aws configure set default.s3.multipart_chunksize 64MB
          SECONDS=0
          $s3 cp "s3://$BUCKET/$build" "s3://$BUCKET/latest/agency-installer.iso" --only-show-errors \
            --content-type application/x-iso9660-image --content-disposition "$disp" \
            --metadata-directive REPLACE --cache-control "public, max-age=300"
          echo "Copied to latest/ in ${SECONDS}s"

          cat > latest.json <<EOF
          {
            "url": "latest/agency-installer.iso",
            "build": "$build",
            "fileName": "agency-installer.iso",
            "sizeBytes": $(stat -c %s "$iso"),
            "sha256": "$(sha256sum "$iso" | cut -d' ' -f1)",
            "date": "$date",
            "commit": "$GITHUB_SHA",
            "version": "${GITHUB_REF_NAME}"
          }
          EOF
          $s3 cp latest.json "s3://$BUCKET/latest.json" \
            --content-type application/json --cache-control "no-cache"
