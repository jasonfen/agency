<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agency</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <symbol id="pointer" viewBox="0 0 54 81">
      <path class="pointer-tip" d="M0 0h9v9h-9z"/>
      <path d="M0 9h18v9h-18zM0 18h27v9h-27zM0 27h36v9h-36zM0 36h45v9h-45zM0 45h54v9h-54zM0 54h36v9h-36zM0 63h9v9h-9zM27 63h18v9h-18zM36 72h18v9h-18z"/>
    </symbol>
  </svg>

  <header class="bar">
    <div class="brand">
      <svg class="brand-mark" shape-rendering="crispEdges" aria-hidden="true"><use href="#pointer"/></svg>
      <span class="brand-name" id="hostname">agency</span>
      <span class="pill" id="pill"><span class="pill-mark"></span><span id="pill-text">Loading</span></span>
    </div>
    <span class="who" id="who"></span>
  </header>

  <div class="frame">
    <nav class="nav" aria-label="Sections">
      <a href="#desktops">Desktops</a>
      <a href="#terminal">Terminal</a>
      <a href="#apps">Apps</a>
      <a href="/settings">Settings</a>
    </nav>

    <main class="main">
      <section id="overview" aria-label="Notices" class="section">
        <div id="notice" role="alert"></div>
        <div id="updates" class="banner"></div>
      </section>

      <section id="desktops" class="section">
        <div class="section-head">
          <h2>Desktops</h2>
          <button type="button" class="button" data-action="desktop-add" data-job>Add a desktop</button>
        </div>
        <div id="desktop-list" class="cards"></div>
      </section>

      <section id="terminal" class="section">
        <div class="section-head">
          <h2>Terminal</h2>
          <a class="button" href="/terminal/" target="_blank" rel="noopener">Open in a new tab</a>
        </div>
        <div class="term">
          <iframe id="term" title="Terminal" data-src="/terminal/"></iframe>
        </div>
        <p class="note" id="term-note">A shell on the machine, in your browser. Start an agent here, or attach to your tmux sessions.</p>
      </section>

      <section id="apps" class="section">
        <div class="section-head">
          <h2>Apps</h2>
          <a class="button" href="/apps">Browse the catalog</a>
        </div>
        <div id="app-list" class="list"><p class="row muted">Loading the list of apps.</p></div>
      </section>
    </main>
  </div>

  <!-- The running job and its log: stays at the bottom of the window. -->
  <aside id="dock" class="dock" aria-live="polite" hidden>
    <div class="dock-progress" aria-hidden="true"></div>
    <div id="dock-body"></div>
    <pre id="dock-log" class="log dock-log" hidden></pre>
  </aside>
  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
